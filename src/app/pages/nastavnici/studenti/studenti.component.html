<div class="card studenti-kartica">
  <div class="card-body">

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
      <h2 class="card-title">Studenti</h2>
      <input
        type="text"
        [(ngModel)]="searchTerm"
        placeholder="Pretraga studenata"
        class="form-control"
        style="max-width: 300px;"
      />
    </div>

    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>Indeks</th>
            <th>Ime</th>
            <th>Prezime</th>
            <th>Detalji</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let s of filtriraniStudenti">
            <td>{{ s.brojIndeksa }}</td>
            <td>{{ s.ime }}</td>
            <td>{{ s.prezime }}</td>
            <td>
              <button class="btn btn-outline-primary btn-sm" (click)="otvoriDetalje(s.id)">Detalji</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>
